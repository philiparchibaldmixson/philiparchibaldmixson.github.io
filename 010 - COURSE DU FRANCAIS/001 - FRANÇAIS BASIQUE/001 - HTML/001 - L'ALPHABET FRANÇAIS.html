<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Alphabet Français</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 1s ease;
        }

        h1 {
            color: white;
            font-size: 3em;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2em;
            font-weight: 300;
        }

        .alphabet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 20px;
            animation: fadeInUp 1s ease;
        }

        .letter-card {
            background: white;
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .letter-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .letter-card:nth-child(1) { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .letter-card:nth-child(2) { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .letter-card:nth-child(3) { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .letter-card:nth-child(4) { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .letter-card:nth-child(5) { background: linear-gradient(135deg, #30cfd0 0%, #330867 100%); }
        .letter-card:nth-child(6) { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); }
        .letter-card:nth-child(7) { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }
        .letter-card:nth-child(8) { background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); }
        .letter-card:nth-child(9) { background: linear-gradient(135deg, #ff6e7f 0%, #bfe9ff 100%); }
        .letter-card:nth-child(10) { background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); }
        .letter-card:nth-child(11) { background: linear-gradient(135deg, #f77062 0%, #fe5196 100%); }
        .letter-card:nth-child(12) { background: linear-gradient(135deg, #c471f5 0%, #fa71cd 100%); }
        .letter-card:nth-child(13) { background: linear-gradient(135deg, #48c6ef 0%, #6f86d6 100%); }
        .letter-card:nth-child(14) { background: linear-gradient(135deg, #feada6 0%, #f5efef 100%); }
        .letter-card:nth-child(15) { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .letter-card:nth-child(16) { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); }
        .letter-card:nth-child(17) { background: linear-gradient(135deg, #96fbc4 0%, #f9f586 100%); }
        .letter-card:nth-child(18) { background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%); }
        .letter-card:nth-child(19) { background: linear-gradient(135deg, #fdcbf1 0%, #e6dee9 100%); }
        .letter-card:nth-child(20) { background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); }
        .letter-card:nth-child(21) { background: linear-gradient(135deg, #d299c2 0%, #fef9d7 100%); }
        .letter-card:nth-child(22) { background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%); }
        .letter-card:nth-child(23) { background: linear-gradient(135deg, #fddb92 0%, #d1fdff 100%); }
        .letter-card:nth-child(24) { background: linear-gradient(135deg, #9890e3 0%, #b1f4cf 100%); }
        .letter-card:nth-child(25) { background: linear-gradient(135deg, #ebc0fd 0%, #d9ded8 100%); }
        .letter-card:nth-child(26) { background: linear-gradient(135deg, #96e6a1 0%, #d4fc79 100%); }

        .letter-upper {
            font-size: 3em;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            margin-bottom: 10px;
        }

        .letter-lower {
            font-size: 2em;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: white;
            font-size: 0.9em;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            
            .alphabet-grid {
                grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
                gap: 15px;
            }
            
            .letter-card {
                padding: 20px 15px;
            }
            
            .letter-upper {
                font-size: 2.5em;
            }
            
            .letter-lower {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>

            </div>
            <div class="letter-card">

        </div>

        <footer>
            <p>✨ Apprenez l'alphabet français avec style ! ✨</p>
        </footer>
    </div>
</body>
</html>
