<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Polyglot Library · Português · English · Español · Italiano · Français</title>
  <meta name="description" content="A single hub that connects every grammar lesson: Brazilian Portuguese, English, Spanish, Italian and French.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="glyphs" id="glyphs" aria-hidden="true"></div>

  <header class="topbar" id="topbar">
    <a class="brand" href="#top" aria-label="Back to top">
      <span class="brand-mark">Aa</span>
      <span class="brand-name">Polyglot Library</span>
    </a>
    <nav class="chips" id="chips" aria-label="Languages"></nav>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle light and dark theme" title="Toggle theme">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main id="top">
    <section class="hero">
      <p class="eyebrow">Grammar courses · Basic → Advanced</p>
      <h1>
        <span class="greeting" id="greeting" aria-live="off">Olá</span><br>
        <em>five languages,</em> one library.
      </h1>
      <p class="lead">Every lesson in this repository, connected in a single page. Pick a language, choose your level and start reading.</p>

      <div class="search" role="search">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="search" placeholder="Search all lessons: verbs, pronomes, subjonctif, articles…" autocomplete="off" spellcheck="false" aria-label="Search lessons">
        <kbd>/</kbd>
      </div>

      <div class="stats" id="stats"></div>
    </section>

    <section class="cards" id="cards" aria-label="Choose a language"></section>

    <section class="results" id="results" hidden aria-live="polite"></section>

    <div id="courses"></div>
  </main>

  <footer class="footer">
    <p>Português Brasileiro · English · Español · Italiano · Français</p>
    <a href="#top">Back to top ↑</a>
  </footer>

  <script src="manifest.js"></script>
  <script src="index.js"></script>
</body>
</html>
